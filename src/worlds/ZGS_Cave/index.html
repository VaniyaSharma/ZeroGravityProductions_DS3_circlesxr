<html>
  <head>
    <!-- Circles' head scripts [REQUIRED] -->
    <circles-start-scripts />
    <title>Music Experience</title>

    <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>
    <script src="scripts/cave-carry-manager.js"></script>
  </head>
  <body>
    <!-- this is used to create our enter UI that creates a 2D overlay to capture a user gesture for sound/mic access etc. -->
    <circles-start-ui />

    <!-- a-scene with 'circles-properties' component [REQUIRED] -->
    <a-scene circles_scene_properties>
      <a-assets>
        <!-- 360 -->
        <img
          id="link_1_360"
          src="/global/images/ZGS_room1.jpg"
          crossorigin="anonymous"
        />
        <a-asset-item
          id="diamond_glb"
          src="assets/diamond-music.glb"
          crossorigin="anonymous"
        ></a-asset-item>
        <a-asset-item
          id="cube_glb"
          src="assets/cube-music-gem.glb"
          crossorigin="anonymous"
        ></a-asset-item>
        <a-asset-item
          id="sphere_glb"
          src="assets/sphere-music-gem.glb"
          crossorigin="anonymous"
        ></a-asset-item>
        <a-asset-item
          id="triangle_glb"
          src="assets/triangle-music-gem.glb"
          crossorigin="anonymous"
        ></a-asset-item>
        <a-asset-item
          id="seed_glb"
          src="assets/Seed.glb"
          crossorigin="anonymous"
        ></a-asset-item>

        <!--via assets-->
        <a-asset-item
          id="cave_model"
          src="assets/cave.glb"
          crossorigin="anonymous"
        ></a-asset-item>
        <a-asset-item
          id="rock1_model"
          src="assets/rock1.glb"
          response-type="arraybuffer"
        ></a-asset-item>
        <a-asset-item
          id="rock2_model"
          src="assets/rock2.glb"
          response-type="arraybuffer"
        ></a-asset-item>
        <a-asset-item
          id="rock3_model"
          src="assets/rock3.glb"
          response-type="arraybuffer"
        ></a-asset-item>
        <a-asset-item
          id="rock4_model"
          src="assets/rock4.glb"
          response-type="arraybuffer"
        ></a-asset-item>
        <a-asset-item
          id="rock5_model"
          src="assets/rock5.glb"
          response-type="arraybuffer"
        ></a-asset-item>

        <!-- audio -->
        <audio
          id="l-blue-note"
          src="assets/lBlue.wav"
          preload="auto"
          crossorigin="anonymous"
        ></audio>

        <audio
          id="h-blue-note"
          src="assets/hBlue.wav"
          preload="auto"
          crossorigin="anonymous"
        ></audio>

        <audio
          id="green-note"
          src="assets/green.wav"
          preload="auto"
          crossorigin="anonymous"
        ></audio>

        <audio
          id="red-note"
          src="assets/red.wav"
          preload="auto"
          crossorigin="anonymous"
        ></audio>

        <audio
          id="yellow-note"
          src="assets/yellow.wav"
          preload="auto"
          crossorigin="anonymous"
        ></audio>

        <audio
          id="melody-full"
          src="assets/melody.wav"
          preload="auto"
          crossorigin="anonymous"
        ></audio>

        <!-- Circles' built-in assets [REQUIRED] -->
        <circles-assets />
      </a-assets>

      <!-- Carry manager script! -->
      <a-entity id="GameManager" carry-manager></a-entity>
      <!-- Circles' built-in manager and avatar [REQUIRED] -->
      <circles-manager-avatar />

      <a-entity circles-spawnpoint position="0 0 4"></a-entity>

      <!-- via -->
      <a-entity
        environment="skyType:color; skyColor: maroon; ground:none;"
      ></a-entity>

      <a-entity class="enviroment">
        <a-entity
          id="cave"
          gltf-model="#cave_model"
          position="0 0 0"
          rotation="0 180 0"
          shadow="cast:false; receive:true;"
        ></a-entity>
        <a-entity
          id="wall_light"
          light="type: point; intensity: 2; distance: 30; decay: 0.5; color:rgb(255,220,220);"
          position="2 10.5 20"
        ></a-entity>
        <a-entity class="rocks">
          <a-entity
            id="rock1"
            gltf-model="#rock1_model"
            position="-9.804 0 -10.377"
            scale="1.889 1.889 1.889"
          ></a-entity>
          <a-entity
            id="rock2"
            gltf-model="#rock2_model"
            position="-8.089 0 -8.194"
            scale="1 1 1"
          ></a-entity>
          <a-entity
            id="rock3"
            gltf-model="#rock3_model"
            position="-12.603 0 15.232"
            scale="1 1 1"
          ></a-entity>
          <a-entity
            id="rock4"
            gltf-model="#rock4_model"
            position="-11.931 0 20.260"
            scale="1.238 1.238 1.238"
          ></a-entity>
          <a-entity
            id="rock5"
            gltf-model="#rock5_model"
            position="-10.386 0 0.520"
            scale="1 1 1"
          ></a-entity>
          <a-entity
            id="rock6"
            gltf-model="#rock1_model"
            position="9.936 0 -11.409"
            scale="1.405 1.405 1.405"
          ></a-entity>
          <a-entity
            id="rock7"
            gltf-model="#rock2_model"
            position="11.728 0 -6.015"
            scale="2.625 2.625 2.625"
          ></a-entity>
          <a-entity
            id="rock8"
            gltf-model="#rock3_model"
            position="12.051 0 23.776"
            scale="2.241 2.241 2.241"
          ></a-entity>
          <a-entity
            id="rock9"
            gltf-model="#rock4_model"
            position="12.297 0 18.119"
            scale="1 1 1"
          ></a-entity>
          <a-entity
            id="rock0"
            gltf-model="#rock5_model"
            position="0 0 13.325"
            scale="1.824 1 1.454"
          ></a-entity>
        </a-entity>
      </a-entity>

      <!-- links to other worlds -->
      <a-entity
        id="link_1"
        position="0 1.22 14"
        rotation="0 90 0"
        scale="0.100 0.950 1.010"
        circles-portal="img_src:#link_1_360; title_text:Sunrise; link_url:/w/ZGS"
        shadow
      ></a-entity>

      <!-- shapes -->

      <a-entity
        id="cube"
        gltf-model="#cube_glb"
        position="7 1.5 7"
        scale="2 2 2"
        circles-interactive-object="type:outline;"
        position-locker="target: 0.0 1.464 1.153; threshold: 0.1"
      >
        <a-entity
          id="cube_light"
          light="type: point; intensity: 5; distance: 20; decay: 1; color:rgb(0,255,0);"
          position="0 0 0"
        ></a-entity>
        <a-entity
          id="cube_music"
          sound="src:#green-note; autoplay:false; loop:false"
        ></a-entity>
      </a-entity>

      <a-entity
        id="triangle"
        gltf-model="#triangle_glb"
        position="-7 1.5 7"
        scale="2 2 2"
        circles-interactive-object="type:outline;"
        position-locker="target: 0.0 1.464 1.153; threshold: 0.1"
      >
        <a-entity
          id="triangle_light"
          light="type: point; intensity: 5; distance: 20; decay: 1; color:rgb(255,0,0);"
          position="0 0 0"
        ></a-entity>
        <a-entity
          id="triangle_music"
          sound="src:#red-note; autoplay:false; loop:false"
        ></a-entity>
      </a-entity>

      <a-entity
        id="diamond"
        gltf-model="#diamond_glb"
        position="7 1.5 -7"
        scale="2 2 2"
        circles-interactive-object="type:outline;"
        position-locker="target: 0.0 1.464 1.153; threshold: 0.1"
      >
        <a-entity
          id="diamond_light"
          light="type: point; intensity: 5; distance: 20; decay: 1; color:rgb(0,0,255);"
          position="0 0 0"
        ></a-entity>
        <a-entity
          id="diamond_music"
          sound="src:#l-blue-note; autoplay:false; loop:false"
        ></a-entity>

        <a-entity
          id="diamond_music_high"
          sound="src:#h-blue-note; autoplay:false; loop:false"
        ></a-entity>
      </a-entity>

      <a-entity
        id="sphere"
        gltf-model="#sphere_glb"
        position="-7 1.5 -7"
        scale="2 2 2"
        circles-interactive-object="type:outline;"
        position-locker="target: 0.0 1.464 1.153; threshold: 0.1"
      >
        <a-entity
          id="sphere_light"
          light="type: point; intensity: 5; distance: 20; decay: 1; color:rgb(255,255,0);"
          position="0 0 0"
        ></a-entity>
        <a-entity
          id="sphere_music"
          sound="src:#yellow-note; autoplay:false; loop:false"
        ></a-entity>
      </a-entity>

      <!-- seed! -->

      <a-entity
        id="seed"
        gltf-model="#seed_glb"
        position="-0.50 -0.6 -0.2"
        circles-pickup-object="animate:false;"
        circles-interactive-object="type:highlight;"
        circles-pickup-networked
        position-locker="target: 0.0 1.464 1.153; threshold: 0.1"
        scale="2 2 2"
      >
        <a-entity
          id="seed_light"
          light="type: point; intensity: 3; distance: 20; decay: 1; color:rgb(150,255,175);"
          position="0 0 0"
        ></a-entity>
        <a-entity
          id="melody_music"
          sound="src:#melody-full; autoplay:false; loop:false"
        ></a-entity>
      </a-entity>
    </a-scene>

    <!-- Circles' end scripts [REQUIRED] -->
    <circles-end-scripts />
  </body>

  <script src="scripts/melody-game.js"></script>
</html>
