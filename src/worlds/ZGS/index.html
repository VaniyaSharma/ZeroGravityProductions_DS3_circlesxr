<html>
  <head>
    <!-- Circles' head scripts [REQUIRED] -->
    <circles-start-scripts />

    <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
    <script src="js/pickuplogic.js"></script>
    <script src="js/position-locker.js"></script>
    <!-- <script src="js/testing.js"></script> -->
    <script src="js/hub-carry-manager.js"></script>
    <script src="js/fire.js"></script>
    <script src="https://unpkg.com/aframe-shader-buildings@^2.0.0/dist/main.js"></script>
  </head>
  <body>
    <!-- this is used to create our enter UI that creates a 2D overlay to capture a user gesture for sound/mic access etc. -->
    <circles-start-ui />

    <!-- a-scene with 'circles-properties' component [REQUIRED] -->
    <a-scene circles_scene_properties>
      <a-assets>
        <!-- 360 -->
        <img
          id="link_1_360"
          src="/global/images/ZGS_room1.jpg"
          crossorigin="anonymous"
        />
        <img
          id="silhouettesMap"
          src="/worlds/Campfire/assets/textures/Silhouettes.png"
          crossorigin="anonymous"
        />
        <img
          id="moonMap"
          src="/worlds/Campfire/assets/textures/moonmap.jpg"
          crossorigin="anonymous"
        />
        <img
          id="skyMap"
          src="/worlds/Campfire/assets/textures/TychoSkymapNASA.png"
          crossorigin="anonymous"
        />

        <a-asset-item
          id="enviro-gltf"
          src="/worlds/ZGS/assets/houses.glb"
          response-type="arraybuffer"
        ></a-asset-item>

        <a-asset-item
          id="moon-gltf"
          src="/worlds/Campfire/assets/models/moon.glb"
          response-type="arraybuffer"
        ></a-asset-item>

        <a-asset-item
          id="pond_glb"
          src="assets/smoothedPond.glb"
          response-type="arraybuffer"
        ></a-asset-item>

        <a-asset-item
          id="nav_gltf"
          src="assets/pizza.glb"
          crossorigin="anonymous"
        ></a-asset-item>

        <a-asset-item
          id="pedestal_glb"
          src="assets/pedestal.glb"
          crossorigin="anonymous"
        ></a-asset-item>

        <a-asset-item
          id="seed_glb"
          src="assets/Seed.glb"
          crossorigin="anonymous"
        ></a-asset-item>

        <a-asset-item
          id="signLamp_glb"
          src="assets/sign.glb"
          crossorigin="anonymous"
        ></a-asset-item>

        <a-asset-item>
          <a-asset-item
            id="campfire-gltf"
            src="assets/campfire.glb"
          ></a-asset-item>
        </a-asset-item>
        <a-asset-item>
          <img
            id="brick"
            src="./assets/TexturesCom_Wall_BrickPlain1_512_albedo.jpg"
          />
        </a-asset-item>

        <audio
          id="fireCrackling-snd"
          src="/worlds/Campfire/assets/audio/fire.mp3"
          preload="true"
        ></audio>

        <!-- Circles' built-in assets [REQUIRED] -->
        <circles-assets />
      </a-assets>

      <!-- Carry manager script! -->
      <a-entity id="GameManager" carry-manager></a-entity>

      <!-- Circles' built-in manager and avatar [REQUIRED] -->
      <circles-manager-avatar />

      <!-- links to other worlds -->
      <a-entity
        id="link_cryo"
        position="-8.841 1.144 -6.017"
        rotation="0 -36.659 0"
        scale="0.100 0.950 1.010"
        circles-portal="img_src:#link_1_360; title_text:Cryo-pods; link_url:/w/ZGS_CryoPod"
        shadow
      ></a-entity>

      <a-entity
        id="link_cave"
        position="10.946 1.2 -6.979"
        rotation="0 -163.750 0"
        scale="0.100 0.950 1.010"
        circles-portal="img_src:#link_1_360; title_text:Melody; link_url:/w/ZGS_Cave"
        shadow
      ></a-entity>

      <a-entity
        id="link_reception"
        position="0.658 1.3 -10.688"
        rotation="0 -90.000.750 0"
        scale="0.100 0.950 1.010"
        circles-portal="img_src:#link_1_360; title_text:Reception; link_url:/w/ZGS_reception"
        shadow
      ></a-entity>

      <a-entity
        id="link_wardrobe"
        position="6.339 1.2 10.846"
        rotation="0 -220 0"
        scale="0.100 0.950 1.010"
        circles-portal="img_src:/global/assets/textures/equirectangular/WhiteBlue.jpg; title_text:Wardrobe; link_url:/w/Wardrobe"
        animation__fireon="property:scale; isRawProperty:true; startEvents:startFireAnim; elasticity:150; autoplay:false; delay:0; dir:normal; dur:1000; easing:easeOutElastic; loop:false; from:0.0001 0.0001 0.0001; to:0.5 0.5 0.5;"
        animation__fireoff="property:scale; isRawProperty:true; startEvents:stopFireAnim; autoplay:false; delay:0; dir:normal; dur:800; easing:easeOutExpo; loop:false; from:0.5 0.5 0.5; to:0.0001 0.0001 0.0001;"
        shadow
      ></a-entity>

      <!-- environment -->
      <!-- the environment -->

      <a-shader-buildings
        sun-position="-0.5 1.0 1.0"
        wall-src="#brick"
        wall-color="#675342"
        window-opacity="0.9"
        buildings='[{"x":5,"z":-995,"xCoreSections":7,"xWingSections":5,"zSections":12,"zWingSections":5,"ySections":30},{"x":0,"z":-1000,"y":120,"xCoreSections":5,"xWingSections":4,"zSections":9,"zWingSections":4,"ySections":30}]'
        material="alphaTest: 0; opacity: 2.18; shader: msdf; blending: multiply; dithering: false"
        position="0 0 407.08653"
        scale="0.5 0.5 0.5"
      ></a-shader-buildings>

      <!-- Picked Up Button -->
      <a-entity
        geometry="primitive: plane; width: 1; height: 0.5;"
        material="color: green;"
        position="-1 1 -3"
        circles-button
        emit-pickedup
      >
        <a-text
          value="Trigger Picked Up"
          align="center"
          position="0 0 0.1"
        ></a-text>
      </a-entity>

      <!-- Position Locked Button -->
      <a-entity
        geometry="primitive: plane; width: 1; height: 0.5;"
        material="color: blue;"
        position="1 1 -3"
        circles-button
        emit-positionlocked
      >
        <a-text
          value="Trigger Position Locked"
          align="center"
          position="0 0 0.1"
        ></a-text>
      </a-entity>

      <!-- <a-entity circles-button="pedastal_color:rgb(74, 87, 95);" circles-sendpoint="target:#door;" position="1 1 -3" rotation="90 0 0" scale="0.8 0.8 0.8"></a-entity> -->

      <a-entity
        id="seed"
        gltf-model="#seed_glb"
        position="0 1 -2"
        circles-pickup-object="animate:false;"
        circles-interactive-object="type:highlight;"
        circles-pickup-networked
        position-locker="target: 0.0 1.400 1.132; threshold: 0.3"
        pickup-detector
      ></a-entity>

      <a-entity
        gltf-model="#pedestal_glb"
        shadow="receive: true; cast: true"
        position="0.781 0.888 0.436"
        scale=" 1.479 1.479 1.479"
      ></a-entity>

      <a-entity
        gltf-model="#enviro-gltf"
        shadow="receive: true; cast: true"
        scale="1 1 1 "
        position="0.473 -0.034 -1.589"
      ></a-entity>

      <a-entity environment="preset:yavapai"></a-entity>

      <a-entity
        gltf-model="#pond_glb"
        shadow="receive: true; cast: true"
        scale="100 100 100 "
        position="0 0 0
    "
      ></a-entity>

      <a-entity
        gltf-model="#signLamp_glb"
        shadow="receive: true; cast: true"
        scale="1 1 1 "
        position="0.872 0.096 0.297"
      ></a-entity>
      <a-entity
        position="0.057 0.134 0"
        id="navmesh"
        gltf-model="#nav_gltf"
        visible="false"
        nav-mesh
      ></a-entity>

      <!-- sky and lights -->
      <a-entity
        light="type: hemisphere; color:#0E192B; groundColor:#1D0A57; intensity: 1.2"
      ></a-entity>
      <a-entity
        id="moonlight"
        position="11.5 8.5 -10.5"
        rotation="75 142 160"
        light="type:directional; color:#0E192B; intensity:15.0; castShadow:true; penumbra:0.4; angle:60.0; shadowMapHeight:512; shadowMapWidth:512;"
      ></a-entity>

      <a-entity
        id="moon"
        position="100.0 100.0 -100.0"
        rotation="47 22 7"
        gltf-model="#moon-gltf"
        circles-material-override="src:#moonMap; side:front; shader:flat; flipTextureY:true;"
      ></a-entity>

      <a-entity
        id="sky"
        geometry="primitive:sphere; radius:500; segmentsWidth:9; segmentsHeight:18"
        material="shader:flat; src:#skyMap; side:back; height:2048; width:2048"
      ></a-entity>

      <!-- Fire Button to trigger the fire -->
      <a-entity
        geometry="primitive: box; width: 1; height: 2;"
        scale=" 1 1  0.721"
        material="color: blue;"
        position="2.455 0.786 -9.017"
      ></a-entity>
      <a-entity
        material="color: red;"
        position="2.479 1.817 -8.974"
        circles-button
        id="fireButton"
      >
        <a-entity
          id="campfire_label"
          circles-label="text:click here for light; visible:true; offset:1.0 0.140 0; arrow_position:left;"
          position="0.481 0.164 0.283"
          rotation="33.590 -135.447 0 "
        ></a-entity>
      </a-entity>

      <!--checkpoints-->

      <!-- spawn point -->
      <a-entity id="spawnPoint" position="0 0.668 0"></a-entity>

      <a-entity
        circles-checkpoint
        circles-spawnpoint
        position="0.878 0.4 -10.372"
      ></a-entity>

      <a-entity circles-checkpoint position="-7.832 0.04 -5.440"></a-entity>

      <a-entity circles-checkpoint position="9.474 0.04 -6.530"></a-entity>

      <a-entity circles-checkpoint position="5.422 0.04 10.554"></a-entity>

      <a-entity circles-checkpoint position="-4.979 0.04 -5.879"></a-entity>

      <a-entity circles-checkpoint position="-1.442 0.04 -7.163"></a-entity>

      <a-entity circles-checkpoint position="2.041 0.04 -6.922"></a-entity>

      <a-entity circles-checkpoint position="6.526 0.04 -4.787"></a-entity>

      <a-entity circles-checkpoint position="7.905 0.04 -0.706"></a-entity>

      <a-entity circles-checkpoint position="7.376 0.04 2.590"></a-entity>

      <a-entity circles-checkpoint position="6.541 0.04 5.744"></a-entity>

      <a-entity circles-checkpoint position="2.211 0.04 7.560"></a-entity>

      <a-entity circles-checkpoint position="-1.776 0.04 7.238"></a-entity>

      <a-entity circles-checkpoint position="-4.613 0.04 5.628"></a-entity>

      <a-entity circles-checkpoint position="-5.472 0.04 1.737"></a-entity>

      <a-entity circles-checkpoint position="-5.628 0.04 -2.494"></a-entity>

      <!-- Add initial moonlight effect -->
      <a-entity
        id="ambient-light"
        light="type: ambient; color: #3A3D3F; intensity: 0.3"
        position="0 2 0"
      ></a-entity>
      <!-- Dim moonlight effect -->
      <a-entity
        id="moon-light"
        light="type: directional; color: #F3F7F6; intensity: 0.5; castShadow: true"
        position="10 10 -10"
      ></a-entity>
      <!-- Directional moonlight -->

      <!-- fire FX -->
      <a-entity id="fireRig" visible="false">
        <!-- Fire Spot 1 -->
        <a-entity position="7.294 1.436 -10.089">
          <a-entity
            animation="property:position; dur:223; to:0.0 0.0 0.05; loop:true; dir:alternate; easing:easeInOutExpo"
          >
            <a-entity
              position="0.0 1.5 0.0"
              animation="property:position; dur:163; to:0.0 1.55 0.0; loop:true; dir:alternate; easing:linear"
            >
              <!-- Light -->
              <a-entity
                light="type: point; color: #FFA200; intensity: 3.5; distance: 20.0; castShadow: true; shadowMapHeight: 256; shadowMapWidth: 256;"
                animation="property:light.intensity; dur:293; dir:alternate; to:3.6; loop:true; easing:easeInOutExpo"
              >
                <!-- Fire Particle -->
                <a-entity
                  fire="particles: 25; size: 0.6; spread: 0.05; velocity: 0.05; opacity: 0.9"
                  sound="src: #fireCrackling-snd; autoplay: true; loop: true"
                ></a-entity>
              </a-entity>
            </a-entity>
          </a-entity>
        </a-entity>

        <!-- Fire Spot 2 -->
        <a-entity position="-5.752 1.405 -9.963">
          <a-entity
            animation="property:position; dur:223; to:0.0 0.0 0.05; loop:true; dir:alternate; easing:easeInOutExpo"
          >
            <a-entity
              position="0.0 1.5 0.0"
              animation="property:position; dur:163; to:0.0 1.55 0.0; loop:true; dir:alternate; easing:linear"
            >
              <a-entity
                light="type: point; color: #FFA200; intensity: 2.5; distance: 10; castShadow: true; shadowMapHeight: 256; shadowMapWidth: 256;"
                animation="property:light.intensity; dur:293; dir:alternate; to:2.5; loop:true; easing:easeInOutExpo"
              >
                <a-entity
                  fire="particles: 25; size: 0.6; spread: 0.05; velocity: 0.05; opacity: 0.9"
                  sound="src: #fireCrackling-snd; autoplay: true; loop: true"
                ></a-entity>
              </a-entity>
            </a-entity>
          </a-entity>
        </a-entity>

        <!-- Fire Spot 3 -->
        <a-entity position="12.404 1.365 1.321">
          <a-entity
            animation="property:position; dur:223; to:0.0 0.0 0.05; loop:true; dir:alternate; easing:easeInOutExpo"
          >
            <a-entity
              position="0.0 1.5 0.0"
              animation="property:position; dur:163; to:0.0 1.55 0.0; loop:true; dir:alternate; easing:linear"
            >
              <a-entity
                light="type: point; color: #FFA200; intensity: 3.5; distance: 20.0; castShadow: true; shadowMapHeight: 256; shadowMapWidth: 256;"
                animation="property:light.intensity; dur:293; dir:alternate; to:3.6; loop:true; easing:easeInOutExpo"
              >
                <a-entity
                  fire="particles: 25; size: 0.6; spread: 0.05; velocity: 0.05; opacity: 0.9"
                  sound="src: #fireCrackling-snd; autoplay: true; loop: true"
                ></a-entity>
              </a-entity>
            </a-entity>
          </a-entity>
        </a-entity>

        <!-- Fire Spot 4 -->
        <a-entity position="-10.680 1.251 1.333">
          <a-entity
            animation="property:position; dur:223; to:0.0 0.0 0.05; loop:true; dir:alternate; easing:easeInOutExpo"
          >
            <a-entity
              position="0.0 1.5 0.0"
              animation="property:position; dur:163; to:0.0 1.55 0.0; loop:true; dir:alternate; easing:linear"
            >
              <a-entity
                light="type: point; color: #FFA200; intensity: 3.5; distance: 20.0; castShadow: true; shadowMapHeight: 256; shadowMapWidth: 256;"
                animation="property:light.intensity; dur:293; dir:alternate; to:3.6; loop:true; easing:easeInOutExpo"
              >
                <a-entity
                  fire="particles: 25; size: 0.6; spread: 0.05; velocity: 0.05; opacity: 0.9"
                  sound="src: #fireCrackling-snd; autoplay: true; loop: true"
                ></a-entity>
              </a-entity>
            </a-entity>
          </a-entity>
        </a-entity>
      </a-entity>
    </a-scene>

    <!-- Circles' end scripts [REQUIRED] -->
    <circles-end-scripts />
  </body>
  <script>
    // Wait for the DOM to be fully loaded
    document.addEventListener("DOMContentLoaded", function () {
      // Get the fire button and fireRig entities using A-Frame's API
      const fireButton = document.getElementById("fireButton");
      document
        .getElementById("ambient-light")
        .setAttribute("light", "intensity: 0.1"); // Darken ambient light
      document
        .getElementById("moon-light")
        .setAttribute("light", "intensity: 0.1"); // Dim moonlight
      const fireRig = document.getElementById("fireRig");

      // Ensure fireRig starts hidden
      fireRig.setAttribute("visible", false);

      // Add an event listener to the fireButton
      fireButton.addEventListener("click", function () {
        // Get the current visibility state of fireRig
        const isFireVisible = fireRig.getAttribute("visible");

        // Toggle the visibility of the fireRig entity when the button is clicked
        if (isFireVisible === false) {
          fireRig.setAttribute("visible", true);
          console.log("Fire is now ON!");
        } else {
          fireRig.setAttribute("visible", false);
          console.log("Fire is now OFF!");
        }
      });
    });
  </script>
</html>
