<html>
  <head>
    <!-- Circles' head scripts [REQUIRED] -->
    <circles-start-scripts />

    <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>
    <script src="https://github.com/msfeldstein/aframe-environment-map-component"></script>

    <!-- ZGS Scripts-->
    <script src="scripts/cryo-carry-manager.js"></script>
    <script src="scripts/orb-placement-checker.js"></script>
    <script src="scripts/position-locker.js"></script>
    <script src="scripts/puzzle-button-trigger.js"></script>
    <script src="scripts/resetPuzzle.js"></script>

    <!--Geometry Script-->
    <script src="scripts/GlassGeo.js"></script>
  </head>
  <body>
    <!-- this is used to create our enter UI that creates a 2D overlay to capture a user gesture for sound/mic access etc. -->
    <circles-start-ui />

    <!-- a-scene with 'circles-properties' component [REQUIRED] -->
    <a-scene circles_scene_properties>
      <a-assets>
        <!-- 360 -->
        <img
          id="link_1_360"
          src="/global/images/ZGS_room1.jpg"
          crossorigin="anonymous"
        />

        <a-asset-item
          id="wallback_glb"
          src="assets/Walls/Wall_back.glb"
          response-type="arraybuffer"
        ></a-asset-item>
        <a-asset-item
          id="wallfront_glb"
          src="assets/Walls/Wall_front.glb"
          response-type="arraybuffer"
        ></a-asset-item>
        <a-asset-item
          id="wallleft_glb"
          src="assets/Walls/Wall_left.glb"
          response-type="arraybuffer"
        ></a-asset-item>
        <a-asset-item
          id="wallright_glb"
          src="assets/Walls/Wall_right.glb"
          response-type="arraybuffer"
        ></a-asset-item>
        <a-asset-item
          id="walltop_glb"
          src="assets/Walls/Wall_top.glb"
          response-type="arraybuffer"
        ></a-asset-item>

        <a-asset-item
          id="table_glb"
          src="assets/Table.glb"
          response-type="arraybuffer"
        ></a-asset-item>
        <a-asset-item
          id="cryoPods_glb"
          src="assets/CryoPod.glb"
          response-type="arraybuffer"
        ></a-asset-item>
        <a-asset-item
          id="monitor_glb"
          src="assets/CryoMonitor.glb"
          response-type="arraybuffer"
        ></a-asset-item>
        <a-asset-item
          id="pipes_glb"
          src="assets/CryoPipes.glb"
          response-type="arraybuffer"
        ></a-asset-item>
        <a-asset-item
          id="pillow_glb"
          src="assets/CryoPodPillow.glb"
          response-type="arraybuffer"
        ></a-asset-item>

        <a-asset-item
          id="glass_glb"
          src="assets/CryoGlass.glb"
          response-type="arraybuffer"
        ></a-asset-item>

        <a-asset-item
          id="sign_glb"
          src="assets/Sign.glb"
          response-type="arraybuffer"
        ></a-asset-item>
        <a-asset-item
          id="personpre_glb"
          src="assets/PersonPre.glb"
          response-type="arraybuffer"
        ></a-asset-item>

        <a-asset-item
          id="personpost_glb"
          src="assets/PersonPost.glb"
          response-type="arraybuffer"
        ></a-asset-item>

        <a-asset-item
          id="nav_glb"
          src="assets/Nav.glb"
          crossorigin="anonymous"
        ></a-asset-item>
        <a-asset-item
          id="seed_glb"
          src="assets/Seed.glb"
          crossorigin="anonymous"
        ></a-asset-item>

        <a-asset-item
          id="orb1_glb"
          src="assets/Orbs/Plant.glb"
          crossorigin="anonymous"
        ></a-asset-item>
        <a-asset-item
          id="orb2_glb"
          src="assets/Orbs/Frog1.glb"
          crossorigin="anonymous"
        ></a-asset-item>
        <a-asset-item
          id="orb3_glb"
          src="assets/Orbs/Gear.glb"
          crossorigin="anonymous"
        ></a-asset-item>

        <a-asset-item
          id="seedholder_glb"
          src="assets/SeedCarrier.glb"
          crossorigin="anonymous"
        ></a-asset-item>

        <a-assets>
          <img id="Monitor_img"
               src="assets/Monitor_Images/MonitorScreen.png">
        </a-assets>
        <a-assets>
          <img id="MonitorText_img"
               src="assets/Monitor_Images/MonitorScreenText.png">
        </a-assets>
        <!-- Circles' built-in assets [REQUIRED] -->
        <circles-assets />
      </a-assets>

      <a-entity id="GameManager" carry-manager></a-entity>
      <!-- Circles' built-in manager and avatar [REQUIRED] -->
      <circles-manager-avatar />

      <!-- links to other worlds -->
      <a-entity
        id="link_1"
        position="-0.190 1.22 5"
        rotation="0 90 0"
        scale="0.100 0.950 1.010"
        circles-portal="img_src:#link_1_360; title_text:Sunrise; link_url:/w/ZGS"
      ></a-entity>

      <!-- seed! -->
      <a-entity
        id="seedHolder"
        gltf-model="#seedholder_glb"
        position="2.653 -1.570 -0.283"
        rotation="0 0 0"
        scale="0.196 0.213 0.228"
        shadow="receive: true; cast: true;"
      ></a-entity>
      <a-entity
        id="seed"
        gltf-model="#seed_glb"
        position="2.480 -0.710 -0.320"
        circles-pickup-object="animate:false;"
        circles-interactive-object="type:highlight;"
        circles-pickup-networked
        shadow="receive: true; cast:true;"
      ></a-entity>

      

      <a-entity
        id="personpre"
        gltf-model="#personpre_glb"
        position="0 0.045 0"
        shadow="receive: true; cast: true;"
      ></a-entity>

      <!--Orb 1-->
      <a-entity
        id="orb1"
        geometry="primitive: sphere;"
        position="-3.5 0.9 -2"
        rotation="0 0 0"
        scale="0.223 0.223 0.223"
        circles-pickup-object="animate:false;"
        circles-interactive-object="type:highlight;"
        circles-pickup-networked
        position-locker="threshold: 0.3"
        material="color: #ffffff; opacity: 0.620; transparent: true; metalness: 0.9; roughness: 0.1; envMapIntensity: 1"
      >
        <a-entity
          id="orb1_inside"
          gltf-model="#orb1_glb"
          position="0 0 0"
          rotation="0 0 0"
          scale="4 4 4"
        ></a-entity>
      </a-entity>

      <!--Orb 2-->
      <a-entity
        id="orb2"
        geometry="primitive: sphere;"
        position="-2.8 0.9 -2.1"
        rotation="0 0 0"
        scale="0.223 0.223 0.223"
        circles-pickup-object="animate:false;"
        circles-interactive-object="type:highlight;"
        circles-pickup-networked
        position-locker="threshold: 0.3"
        material="color: #ffffff; opacity: 0.620; transparent: true; metalness: 0.9; roughness: 0.1; envMapIntensity: 1"
      >
        <a-entity
          id="orb2_inside"
          gltf-model="#orb2_glb"
          position="0 0 0"
          rotation="0 180 0"
          scale="4 4 4"
        ></a-entity>
      </a-entity>

      <!--Orb 3-->
      <a-entity
        id="orb3"
        geometry="primitive: sphere;"
        position="-2.73 0.9 -2.78"
        rotation="0 0 0"
        scale="0.223 0.223 0.223"
        circles-pickup-object="animate:false;"
        circles-interactive-object="type:highlight;"
        circles-pickup-networked
        position-locker="threshold: 0.3"
        material="color: #ffffff; opacity: 0.620; transparent: true; metalness: 0.9; roughness: 0.1; envMapIntensity: 1"
      >
        <a-entity
          id="orb3_inside"
          gltf-model="#orb3_glb"
          position="0 0 0"
          rotation="0 180 0"
          scale="4 4 4"
        ></a-entity>
      </a-entity>

      <!--Sockets-->
      <a-entity
        id="socket1"
        position="-2 0.7 -4.3"
        collider  
        orb-placement-checker="expectedOrbId: orb1;"
      ></a-entity>
      <a-entity
        id="socket2"
        position="-2.02 2.055 -4.328"
        collider
        orb-placement-checker="expectedOrbId: orb3;"
      ></a-entity>
      <a-entity
        id="socket3"
        position="1.073 1.3 -4.3"
        collider
        orb-placement-checker="expectedOrbId: orb2;"
      ></a-entity>
      <!-- environment -->
      <!-- the environment -->
      <a-entity
        id="SpawnPoint"
        circles-spawnpoint
        circles-checkpoint
        position="-0.25 0.040 4"
      ></a-entity>
      <a-entity 
        circles-checkpoint 
        position="-1.892 0.040 -2.450"
      ></a-entity>
      <a-entity 
        circles-checkpoint 
        position="-2.091 0.040 -1.115"
      ></a-entity>
      <a-entity 
        circles-checkpoint 
        position="-0.4 0.040 1"
      ></a-entity>
      <a-entity 
        circles-checkpoint 
        position="1.091 0.040 -0.568"
      ></a-entity>
      <a-entity 
        circles-checkpoint 
        position="0.383 0.040 -2.439"
      ></a-entity>


      <!-- Walls -->
      <a-entity
        id="wall_back"
        position="0 0 0"
        gltf-model="#wallback_glb"
        shadow="receive: true; cast: false;"
      ></a-entity>
      <a-entity
        id="wall_front"
        position="0 0 0"
        gltf-model="#wallfront_glb"
        shadow="receive: true; cast: false;"
      ></a-entity>
      <a-entity
        id="wall_left"
        position="0 0 0"
        gltf-model="#wallleft_glb"
        shadow="receive: true; cast: false;"
      ></a-entity>
      <a-entity
        id="wall_right"
        position="0 0 0"
        gltf-model="#wallright_glb"
        shadow="receive: true; cast: false;"
      ></a-entity>
      <a-entity
        id="wall_top"
        position="0 0 0"
        gltf-model="#walltop_glb"
        shadow="receive: true; cast: false;"
      ></a-entity>

      <a-entity
        id="pod"
        position="0 0 0"
        gltf-model="#cryoPods_glb"
        shadow="receive: true; cast: false;"
      ></a-entity>

      <a-entity
        id="podglass"
        position="-0.47 1.449 -3.398"
        rotation="-6.310 0 0"
        scale   ="0.872 1.376 1.935"
        geometry="primitive: cryoGlass;"
        material="color: #ffffff; opacity: 0.620; transparent: true; metalness: 0.9; roughness: 0.1; envMapIntensity: 1"
      ></a-entity>

      <a-entity
        id="table"
        position="0 -0.02 0"
        gltf-model="#table_glb"
        shadow="receive: true; cast: true;"
      ></a-entity>

      <a-entity
        id="monitor"
        position="-0.032 0.045 0.059"
        gltf-model="#monitor_glb"
        shadow="receive: false; cast: true"
      >
      <a-image
        src="#Monitor_img"
        position="2.031 1.296 -1.967"
        rotation="0 -54.622 0"
        scale="1.78 1.12 0.8"
        side="front"
      ></a-image>
      <a-entity
        id="monitor_puzzle_button"
        position="1.891 1.166 -2.292"
        rotation="0.084 38.28 90" 
        circles-button="pedastal_visible: false;
                        diameter:0.5;
                        button_color: #61fffc;
                        button_color_hover: #85ffca;"
        puzzle-button-trigger="socketIds: socket1, socket2, socket3;"
        shadow="receive: false; cast: true;"
      ></a-entity>
      <a-entity
        id="monitor_reset_button"
        position="2.301 1.165 -1.716"
        rotation="1.222 32.50 90"
        circles-button="pedastal_visible: false;
                        diameter:0.5;
                        button_color: #61fffc;
                        button_color_hover: #85ffca;"
        reset-puzzle ="orbIds: orb1, orb2, orb3;"
        shadow="receive: false; cast: true;"
      ></a-entity>
      </a-entity>

      <a-entity
        id="pipes"
        position="0 0.045 0"
        gltf-model="#pipes_glb"
        shadow="receive: true; cast: true;"
      ></a-entity>

      <a-entity
        id="pillow"
        position="0 0.045 0"
        gltf-model="#pillow_glb"
        shadow="receive: true; cast: false;"
      ></a-entity>

      <a-entity
        id="sign"
        position="0 0.045 0"
        gltf-model="#sign_glb"
      ></a-entity>

      <a-entity environment="
        preset:yavapai; 
        shadow: true; 
        ground: none;
        dressing: none;
        stageSize: 10;
        lighting: none;
        "
       ></a-entity>

       <a-entity
        id="RoomLight"
        light="type: ambient;
               intensity: 1; 
               color: #FFFFFF"
        position="0 4.177 0"
       ></a-entity>

       <a-entity
        id="RoomLight1"
        light="type: spot;
               intensity: 2; 
               distance: 25; 
               decay: 2; 
               castShadow: true;
               shadowBias: -0.002;
               shadowCameraFov: 100;
               shadowMapHeight: 2048;
               shadowMapWidth: 2048; 
               color: #FFFFFF"
        position="-0.48 0.355 -3.304"
        rotation="60 0 0"
       ></a-entity>
       
       <a-entity
        id="RoomLight2"
        light="type: point; 
               intensity: 30;
               distance: 25;
               decay: 2;
               castShadow: true;
               shadowBias: -0.002;
               shadowCameraFov: 100;
               shadowMapHeight: 2048;
               shadowMapWidth: 2048;
               color: #FFFFFF"
        position="0 5.6 -3.230"
       ></a-entity>

      <a-entity
        position="0 0 0"
        id="navmesh"
        gltf-model="#nav_glb"
        visible="true"
        nav-mesh
        shadow="receive: true;"
      ></a-entity>
    </a-scene>
      <a-entity
        position="0 0.045 0"
        id="navmesh"
        gltf-model="#nav_glb"
        visible="true"
        nav-mesh
        shadow="receive: true;"
      ></a-entity>
    </a-scene>
    <!-- Circles' end scripts [REQUIRED] -->
    <circles-end-scripts />
  </body>
</html>
