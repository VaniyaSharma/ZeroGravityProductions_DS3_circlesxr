<html>
  <head>
    <!-- Circles' head scripts [REQUIRED] -->
    <circles-start-scripts />

    <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>
    <script src="https://github.com/msfeldstein/aframe-environment-map-component"></script>
    <script src="scripts/cryo-carry-manager.js"></script>
    <script src="scripts/flashlight.js"></script>
  </head>
  <body>
    <!-- this is used to create our enter UI that creates a 2D overlay to capture a user gesture for sound/mic access etc. -->
    <circles-start-ui />

    <!-- a-scene with 'circles-properties' component [REQUIRED] -->
    <a-scene circles_scene_properties>
      <a-assets>
        <!-- 360 -->
        <img
          id="link_1_360"
          src="/global/images/ZGS_room1.jpg"
          crossorigin="anonymous"
        />

        <a-asset-item
          id="enviro_glb"
          src="assets/Walls.glb"
          response-type="arraybuffer"
        ></a-asset-item>
        <a-asset-item
          id="table_glb"
          src="assets/Table.glb"
          response-type="arraybuffer"
        ></a-asset-item>
        <a-asset-item
          id="cryoPods_glb"
          src="assets/CryoPod.glb"
          response-type="arraybuffer"
        ></a-asset-item>
        <a-asset-item
          id="monitor_glb"
          src="assets/CryoMonitor.glb"
          response-type="arraybuffer"
        ></a-asset-item>
        <a-asset-item
          id="pipes_glb"
          src="assets/CryoPipes.glb"
          response-type="arraybuffer"
        ></a-asset-item>
        <a-asset-item
          id="pillow_glb"
          src="assets/CryoPodPillow.glb"
          response-type="arraybuffer"
        ></a-asset-item>
        <a-asset-item
          id="sign_glb"
          src="assets/Sign.glb"
          response-type="arraybuffer"
        ></a-asset-item>
        <a-asset-item
          id="personpre_glb"
          src="assets/PersonPre.glb"
          response-type="arraybuffer"
        ></a-asset-item>
        <a-asset-item
          id="nav_glb"
          src="assets/Nav.glb"
          crossorigin="anonymous"
        ></a-asset-item>
        <a-asset-item
          id="seed_glb"
          src="assets/Seed.glb"
          crossorigin="anonymous"
        ></a-asset-item>
        <a-assets>
          <img id="Monitor_img"
               src="assets/Monitor_Images/MonitorScreen.png">
        </a-assets>
        <a-assets>
          <img id="MonitorText_img"
               src="assets/Monitor_Images/MonitorScreenText.png">
        </a-assets>
        <!-- Circles' built-in assets [REQUIRED] -->
        <circles-assets />
      </a-assets>

      <a-entity id="GameManager" carry-manager></a-entity>
      <!-- Circles' built-in manager and avatar [REQUIRED] -->
      <circles-manager-avatar />

      <!-- links to other worlds -->
      <a-entity
        id="link_1"
        position="0 1.22 5"
        rotation="0 90 0"
        scale="0.100 0.950 1.010"
        circles-portal="img_src:#link_1_360; title_text:Sunrise; link_url:/w/ZGS"
      ></a-entity>

      <!-- seed! -->

      <a-entity
        id="seed"
        gltf-model="#seed_glb"
        position="-0.50 0.6 -0.2"
        circles-pickup-object="animate:false;"
        circles-interactive-object="type:highlight;"
        circles-pickup-networked
        position-locker="threshold: 0.1"
        shadow="receive: true;"
      ></a-entity>


      <a-entity
        id="personpre"
        gltf-model="#personpre_glb"
        position="0 0.045 0"
        shadow="receive: true; cast: true"
      ></a-entity>

      <!-- environment -->
      <!-- the environment -->
      <a-entity
        id="SpawnPoint"
        circles-spawnpoint
        position="-0.45 0.040 4"
      ></a-entity>

      <a-entity
        id="walls"
        position="0 0 0"
        gltf-model="#enviro_glb"
        shadow="receive: true; cast: false"
      ></a-entity>

      <a-entity
        id="pod"
        position="0 0 0"
        gltf-model="#cryoPods_glb"
      ></a-entity>

      <a-entity
        id="table"
        position="0 -0.02 0"
        gltf-model="#table_glb"
        shadow="cast: true"
      ></a-entity>

      <a-entity
        id="monitor"
        position="0 0.045 0"
        gltf-model="#monitor_glb"
        shadow="cast: true"
      >
      <a-image
        src="#Monitor_img"
        position="2.031 1.296 -1.967"
        rotation="0 -54.622 0"
        scale="1.78 1.12 0.8"
        side="front"
      ></a-image>
      <a-entity
        id="monitor_puzzle_button"
        position="2.466 0.876 -1.559"
        rotation="-0.149 33.903 87.986"
        circles-button="pedestal_visble: false;
                        diameter:0.220
                        button_color: #61fffc
                        button_color_hover: #85ffca"
        puzzle-button-trigger
      ></a-entity>
      <a-entity
        id="monitor_puzzle_button"
        position="2.466 1.500 -1.559"
        rotation="-0.149 33.903 87.986"
        circles-button="pedestal_visble: false;
                        diameter:0.220
                        button_color: #61fffc
                        button_color_hover: #85ffca"
        reset-puzzle
      ></a-entity>
      </a-entity>

      <a-entity
        id="pipes"
        position="0 0.045 0"
        gltf-model="#pipes_glb"
        shadow="receive: true; cast: true"
      ></a-entity>

      <a-entity
        id="pillow"
        position="0 0.045 0"
        gltf-model="#pillow_glb"
        shadow="receive: true;"
      ></a-entity>

      <a-entity
        id="sign"
        position="0 0.045 0"
        gltf-model="#sign_glb"
        shadow="receive: true; cast: true"
      ></a-entity>
</a-image>

      <a-entity environment="
        preset:yavapai; 
        shadow: true; 
        ground: none;
        dressing: none;
        stageSize: 10;
        lighting: none;
        "
       ></a-entity>

       <a-entity
        id="RoomLight"
        light="type: ambient;
               intensity: 1; 
               color: #FFFFFF"
        position="0 4.177 0"
       ></a-entity>

       <a-entity
        id="RoomLight1"
        light="type: point; 
               intensity: 2; 
               distance: 25; 
               decay: 2; 
               castShadow: false; 
               shadowBias: 0.002; 
               shadowCameraFov: 100;
               shadowMapHeight: 2048;
               shadowMapWidth: 2048; 
               color: #FFFFFF"
        position="0 0 0"
       ></a-entity>
      
       <a-entity
        id="RoomLight2"
        light="type: point; 
               intensity: 2; 
               distance: 25; 
               decay: 2; 
               castShadow: false; 
               shadowBias: 0.002; 
               shadowCameraFov: 100;
               shadowMapHeight: 2048;
               shadowMapWidth: 2048; 
               color: #FFFFFF"
        position="0 0 0"
       ></a-entity>

      <a-entity
        position="0 0 0"
        id="navmesh"
        gltf-model="#nav_glb"
        visible="true"
        nav-mesh
        shadow="receive: true;"
      ></a-entity>
    </a-scene>
      <a-entity
        position="0 0.045 0"
        id="navmesh"
        gltf-model="#nav_glb"
        visible="true"
        nav-mesh
        shadow="receive: true;"
      ></a-entity>
    </a-scene>
    <!-- Circles' end scripts [REQUIRED] -->
    <circles-end-scripts />
  </body>
</html>
