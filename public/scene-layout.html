<!DOCTYPE html>
<html>

<head>
    <title>Music Experience</title>
    <meta charset="utf-8" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script
        src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>

</head>

<body>

    <a-scene>
        <a-assets>
            <!--assets-->
            <a-asset-item id="desk_model" src="assets/reception-desk.glb" response-type="arraybuffer"></a-asset-item>
            <a-asset-item id="bowl_inactive_model" src="assets/bowl-inactive.glb"
                response-type="arraybuffer"></a-asset-item>
            <a-asset-item id="bowl_active_model" src="assets/bowl-active.glb"
                response-type="arraybuffer"></a-asset-item>
            <a-asset-item id="orb_inactive_model" src="assets/orb-inactive.glb"
                response-type="arraybuffer"></a-asset-item>
            <a-asset-item id="orb_active_model" src="assets/orb-active.glb" response-type="arraybuffer"></a-asset-item>
            <a-asset-item id="room_model" src="assets/room.glb" response-type="arraybuffer"></a-asset-item>
        </a-assets>


        <a-entity camera wasd-controls look-controls position="0 1.6 0">
            <a-entity cursor="rayOrigin:mouse;" raycaster="far:20; interval:200; objects:.interactive"></a-entity>
        </a-entity>



        <a-entity class="enviroment">
            <a-entity id="room" gltf-model="#room_model" position="0 0 -4" rotation="0 0 0" scale="1 0.7 1"
                shadow="cast:false; recieve:true;"></a-entity>
            <a-entity id="desk" gltf-model="#desk_model" position="-1 0 -4" rotation="0 0 0"></a-entity>
            <a-entity id="doorway" geometry="primitive:box; height:3; width:2;" material="color:black"
                position="0 1.5 2.5"></a-entity>
        </a-entity>
        <a-entity class="important-items">
            <a-entity id="bowl" gltf-model="#bowl_inactive_model" position="0 0 -3" rotation="0 24 0"
                scale="0.2 0.2 0.2"></a-entity>
            <a-entity id="orb" gltf-model="#orb_inactive_model" position="-0.748 1.126 -3.630" rotation="0 18 0"
                scale="0.2 0.2 0.2"></a-entity>
        </a-entity>

    </a-scene>
</body>

</html>
